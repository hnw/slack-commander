version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocyclo
    - gosec

  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 15
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter

  exclusions:
    paths:
      - vendor
      - ".*\\.pb\\.go$"
      - ".*\\.gen\\.go$"
