display_information:
  name: slack-commander

features:
  bot_user:
    display_name: slack-commander
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - chat:write.customize
      - files:write
      - groups:history
      - im:history
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im

  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
